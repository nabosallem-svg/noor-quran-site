<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FBF8F2;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-dim": "#DDD6C8", "primary": "#0F1B3D", "background": "#FBF8F2", "tertiary-fixed": "#F6DFA6", "inverse-on-surface": "#F3F0EA", "surface-bright": "#FBF8F2", "surface-container-lowest": "#ffffff", "tertiary-fixed-dim": "#E2B65C", "tertiary-container": "#2A1D05", "inverse-surface": "#2C2E38", "on-error": "#ffffff", "primary-fixed": "#DCE3F7", "on-primary-container": "#A9B8E8", "on-tertiary-container": "#B88A2E", "surface": "#FBF8F2", "surface-container-low": "#F6F2EA", "on-tertiary-fixed-variant": "#5d4201", "on-secondary-fixed-variant": "#7A3A0E", "primary-fixed-dim": "#B7C3E6", "surface-container-highest": "#E3DCCE", "inverse-primary": "#B7C3E6", "error-container": "#ffdad6", "surface-container": "#F0EBE1", "primary-container": "#16285A", "on-secondary": "#ffffff", "tertiary": "#1d1200", "surface-tint": "#3B4C80", "secondary-fixed": "#FBE3CF", "on-background": "#1A1B22", "on-primary-fixed-variant": "#2E3D6B", "on-surface-variant": "#4A4D5C", "outline-variant": "#C9C6BE", "on-secondary-container": "#7A3A0E", "on-surface": "#1A1B22", "on-primary": "#ffffff", "secondary-fixed-dim": "#F2B48A", "on-tertiary": "#ffffff", "on-primary-fixed": "#0A1430", "secondary-container": "#FBE3CF", "on-secondary-fixed": "#2E1300", "secondary": "#A9541A", "outline": "#767A8C", "on-tertiary-fixed": "#261900", "on-error-container": "#93000a", "error": "#ba1a1a", "surface-container-high": "#EAE4D8", "surface-variant": "#E3DCCE" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1.25rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "margin-desktop": "3rem", "margin": "1rem", "gutter-desktop": "2rem", "space-md": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "label-md": ["IBM Plex Sans Arabic", "sans-serif"], "label-sm": ["IBM Plex Sans Arabic", "sans-serif"], "headline-md": ["Noto Naskh Arabic", "serif"], "headline-lg-mobile": ["Noto Naskh Arabic", "serif"], "title-md": ["IBM Plex Sans Arabic", "sans-serif"], "body-lg": ["IBM Plex Sans Arabic", "sans-serif"], "headline-lg": ["Noto Naskh Arabic", "serif"], "display-hero": ["Noto Naskh Arabic", "serif"], "display-hero-mobile": ["Noto Naskh Arabic", "serif"], "body-md": ["IBM Plex Sans Arabic", "sans-serif"] }, "fontSize": { "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "34px", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "36px", "fontWeight": "600" }], "title-md": ["18px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["17px", { "lineHeight": "30px", "fontWeight": "400" }], "headline-lg": ["36px", { "lineHeight": "48px", "fontWeight": "600" }], "display-hero": ["48px", { "lineHeight": "64px", "fontWeight": "700" }], "display-hero-mobile": ["32px", { "lineHeight": "44px", "fontWeight": "700" }], "body-md": ["15px", { "lineHeight": "26px", "fontWeight": "400" }] } } } };</script><link rel="stylesheet" href="assets/theme.css"><title>لوحة المقرأة</title><meta name="robots" content="noindex, nofollow">
<style>
  .adm-tab[aria-selected="true"]{background:#0F1B3D;color:#fff}
  .adm-badge:empty{display:none}
  .adm-in{width:100%;height:44px;padding:0 12px;border-radius:12px;background:#F4EFE6;color:#0F1B3D;outline:none}
  textarea.adm-in{height:auto;padding:10px 12px}
  .adm-in:focus{background:#EFE8DC}
</style>
</head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen">
<header class="fixed top-0 inset-x-0 z-50 pt-safe" style="background:#0F1B3D">
  <div class="h-16 px-gutter max-w-2xl mx-auto flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 min-w-0">
      <img src="assets/img/logo.svg" alt="" class="w-9 h-9 shrink-0">
      <div class="flex flex-col leading-tight"><span class="font-title-md text-title-md text-white">مقرأة الإتقان</span><span class="font-label-sm text-label-sm" style="color:#C9D2EE">لوحة التحكم</span></div>
    </div>
    <div class="flex items-center gap-2">
      <button id="notifyBtn" type="button" class="hidden h-9 px-3 rounded-full bg-secondary text-on-secondary font-label-md text-label-md flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">notifications</span>فعّل الإشعارات</button>
      <button id="logoutBtn" type="button" class="hidden h-9 px-3 rounded-full font-label-md text-label-md text-white border border-white/30">خروج</button>
    </div>
  </div>
</header>

<main class="pt-20 pb-16 px-gutter max-w-2xl mx-auto">

  <!-- Not connected yet -->
  <section id="setupView" class="hidden bg-surface-container-lowest rounded-xl p-space-md flex flex-col gap-3">
    <h1 class="font-headline-md text-headline-md text-primary">قاعدة البيانات لسه مش متوصلة</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">اللوحة بتشتغل بعد ما تعمل مشروع مجاني على Supabase وتحط بياناته في الملف <code dir="ltr">assets/js/config.js</code>. الخطوات كاملة في ملف <code dir="ltr">supabase/README.md</code> في المستودع.</p>
  </section>

  <!-- Sign in -->
  <section id="loginView" class="hidden bg-surface-container-lowest rounded-xl p-space-md flex flex-col gap-3 max-w-md mx-auto">
    <h1 class="font-headline-md text-headline-md text-primary">تسجيل الدخول</h1>
    <form id="loginForm" class="flex flex-col gap-3">
      <input id="loginEmail" class="adm-in" dir="ltr" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
      <input id="loginPass" class="adm-in" dir="ltr" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
      <button class="h-12 rounded-xl bg-secondary text-on-secondary font-title-md text-title-md" type="submit">دخول</button>
      <button id="signupBtn" class="h-11 rounded-xl bg-surface-container text-primary font-label-md text-label-md" type="button">أول مرة؟ اعمل حساب المدير</button>
      <p id="loginErr" class="font-label-md text-label-md text-error"></p>
      <p id="loginInfo" class="font-label-md text-label-md text-primary"></p>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="appView" class="hidden flex flex-col gap-4">
    <nav class="sticky top-16 z-40 bg-surface py-2 -mx-1 px-1 flex gap-1.5 overflow-x-auto no-scrollbar" role="tablist">
      <button class="adm-tab shrink-0 h-10 px-3.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md flex items-center gap-1.5" data-tab="bookings" role="tab">الحجوزات <span class="adm-badge min-w-5 h-5 px-1.5 rounded-full bg-secondary text-on-secondary text-[11px] flex items-center justify-center" id="badge-bookings"></span></button>
      <button class="adm-tab shrink-0 h-10 px-3.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md flex items-center gap-1.5" data-tab="students" role="tab">الطلاب</button>
      <button class="adm-tab shrink-0 h-10 px-3.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md flex items-center gap-1.5" data-tab="payments" role="tab">المدفوعات <span class="adm-badge min-w-5 h-5 px-1.5 rounded-full bg-secondary text-on-secondary text-[11px] flex items-center justify-center" id="badge-payments"></span></button>
      <button class="adm-tab shrink-0 h-10 px-3.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md flex items-center gap-1.5" data-tab="level_tests" role="tab">الاختبارات <span class="adm-badge min-w-5 h-5 px-1.5 rounded-full bg-secondary text-on-secondary text-[11px] flex items-center justify-center" id="badge-level_tests"></span></button>
      <button class="adm-tab shrink-0 h-10 px-3.5 rounded-full bg-surface-container-low text-primary font-label-md text-label-md flex items-center gap-1.5" data-tab="schedule" role="tab">المواعيد</button>
    </nav>
    <div id="panel" class="flex flex-col gap-3"></div>
  </section>
</main>

<!-- Student form -->
<div id="sheet" class="hidden fixed inset-0 z-[60] bg-primary/60 flex items-end sm:items-center justify-center p-3">
  <form id="studentForm" class="w-full max-w-lg max-h-[92vh] overflow-y-auto bg-surface rounded-2xl p-5 flex flex-col gap-3">
    <div class="flex items-center justify-between"><h2 id="sheetTitle" class="font-headline-md text-headline-md text-primary">طالب جديد</h2><span id="sheetCode" class="font-title-md text-title-md text-secondary" dir="ltr"></span></div>
    <input type="hidden" name="id"><input type="hidden" name="booking_id">
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">الاسم<input class="adm-in" name="name" required minlength="2"></label>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">رقم واتساب<input class="adm-in" name="phone" dir="ltr"></label>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">المسار<input class="adm-in" name="track" placeholder="مثال: جزء عم"></label>
    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">التقدم %<input class="adm-in" name="progress" type="number" min="0" max="100" value="0"></label>
      <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">حصص خلصت<input class="adm-in" name="sessions_done" type="number" min="0" value="0"></label>
    </div>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">الحفظ الجديد<input class="adm-in" name="new_task"></label>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">مراجعة قريبة<input class="adm-in" name="recent_review"></label>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">مراجعة بعيدة<input class="adm-in" name="far_review"></label>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">ملاحظة المعلم<textarea class="adm-in" name="teacher_note" rows="3"></textarea></label>
    <label class="flex flex-col gap-1 font-label-md text-label-md text-primary">الحصة الجاية (بتوقيت جهازك)<input class="adm-in" name="next_session" type="datetime-local"></label>
    <label class="flex items-center gap-2 font-label-md text-label-md text-primary"><input name="active" type="checkbox" checked class="w-5 h-5"> الطالب نشط (الكود شغال)</label>
    <div class="flex gap-2 pt-1">
      <button class="flex-1 h-12 rounded-xl bg-secondary text-on-secondary font-title-md text-title-md" type="submit">حفظ</button>
      <button class="h-12 px-5 rounded-xl bg-surface-container text-primary font-label-md text-label-md" type="button" onclick="closeSheet()">إلغاء</button>
    </div>
  </form>
</div>

<div id="toast" class="hidden fixed bottom-6 inset-x-4 z-[70] max-w-md mx-auto text-center p-3 rounded-xl font-label-md text-label-md text-white"></div>

<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script>
<script>
var API=window.ItqanAPI,A=API.admin;
var TAB='bookings',seenCounts={},firstPoll=true,pollTimer=null;
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var STATUS={new:['جديد','bg-secondary-fixed text-on-secondary-fixed'],confirmed:['متأكد','bg-primary-container text-on-primary'],done:['خلصت','bg-surface-container-high text-on-surface-variant'],cancelled:['ملغي','bg-error-container text-on-error-container'],verified:['اتأكد','bg-primary-container text-on-primary'],rejected:['مرفوض','bg-error-container text-on-error-container']};

function $(id){return document.getElementById(id)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,bad){var t=$('toast');t.textContent=m;t.style.background=bad?'#93000a':'#0F1B3D';t.classList.remove('hidden');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.add('hidden')},2600)}
function fail(e){if(e&&e.code==='SIGNED_OUT'){show('login');return}toast('حصلت مشكلة: '+(e&&e.message||'غير معروف'),true)}
function fmtTime(t){try{return new Date('2000-01-01T'+t+':00').toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}catch(e){return t}}
function fmtDay(iso){var d=new Date(iso+'T12:00:00');return DAYS[d.getDay()]+' '+d.toLocaleDateString('ar-EG',{day:'numeric',month:'long'})}
function fmtStamp(s){var d=new Date(s);return d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}
function pill(st){var p=STATUS[st]||[st,''];return '<span class="px-2 py-0.5 rounded-full text-[12px] font-bold '+p[1]+'">'+p[0]+'</span>'}
function btn(label,on,cls){return '<button type="button" class="h-9 px-3 rounded-lg font-label-md text-label-md '+(cls||'bg-surface-container text-primary')+'" onclick="'+on+'">'+label+'</button>'}
function waBtn(phone,text,label){return '<a target="_blank" rel="noopener" class="h-9 px-3 rounded-lg font-label-md text-label-md bg-secondary text-on-secondary flex items-center gap-1" href="'+esc(API.waLink(phone,text))+'"><span class="material-symbols-outlined text-[16px]">chat</span>'+(label||'واتساب')+'</a>'}
function row(k,v){return v?'<div class="flex gap-2"><span class="text-on-surface-variant shrink-0">'+k+':</span><span class="text-on-surface">'+esc(v)+'</span></div>':''}
function empty(m){return '<p class="text-center text-on-surface-variant py-10">'+m+'</p>'}
function newTag(x){return x.seen===false?'<span class="w-2 h-2 rounded-full bg-secondary inline-block"></span>':''}

function show(v){['setup','login','app'].forEach(function(n){$(n+'View').classList.toggle('hidden',n!==v)});$('logoutBtn').classList.toggle('hidden',v!=='app');
  $('notifyBtn').classList.toggle('hidden',!(v==='app'&&'Notification' in window&&Notification.permission==='default'));
  if(v==='app'){openTab(TAB);poll();clearInterval(pollTimer);pollTimer=setInterval(poll,30000)}else clearInterval(pollTimer)}

/* ───── tabs ───── */
var cache={};
function openTab(t){
  TAB=t;try{localStorage.setItem('itqan_admin_tab',t)}catch(e){}
  document.querySelectorAll('.adm-tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false')});
  $('panel').innerHTML=empty('جاري التحميل...');
  ({bookings:loadBookings,students:loadStudents,payments:loadPayments,level_tests:loadTests,schedule:loadSchedule})[t]();
}
document.querySelectorAll('.adm-tab').forEach(function(b){b.onclick=function(){openTab(b.dataset.tab)}});
function markSeen(table){A.update(table,'seen=eq.false',{seen:true}).then(function(){$('badge-'+table).textContent='';seenCounts[table]=0;title()}).catch(function(){})}

/* ───── bookings ───── */
var bookFilter='upcoming';
function loadBookings(){
  var today=API.siteNow().date;
  var q=bookFilter==='upcoming'?'select=*&slot_date=gte.'+today+'&status=neq.cancelled&order=slot_date.asc,slot_time.asc&limit=300':'select=*&order=created_at.desc&limit=300';
  A.list('bookings',q).then(function(rows){
    cache.bookings={};rows.forEach(function(r){cache.bookings[r.id]=r});
    var head='<div class="flex gap-2">'+['upcoming:الجاية','all:الكل'].map(function(x){x=x.split(':');return '<button type="button" onclick="bookFilter=\''+x[0]+'\';loadBookings()" class="h-9 px-3 rounded-full font-label-md text-label-md '+(bookFilter===x[0]?'bg-secondary text-on-secondary':'bg-surface-container-low text-primary')+'">'+x[1]+'</button>'}).join('')+'</div>';
    $('panel').innerHTML=head+(rows.length?rows.map(bookingCard).join(''):empty('مفيش حجوزات لسه.'));
    markSeen('bookings');
  }).catch(fail);
}
function bookingCard(b){
  var when=fmtDay(b.slot_date)+' · '+fmtTime(b.slot_time);
  var confirmMsg='السلام عليكم '+b.name+'، تم تأكيد حصتك التجريبية في مقرأة الإتقان يوم '+when+' بتوقيت مكة. هنبعتلك لينك الحصة قبل الميعاد إن شاء الله.';
  return '<article class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-2">'
   +'<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2">'+newTag(b)+'<h3 class="font-title-md text-title-md text-primary">'+esc(b.name)+'</h3></div>'+pill(b.status)+'</div>'
   +'<p class="font-title-md text-title-md text-secondary">'+when+' <span class="font-label-sm text-label-sm text-on-surface-variant">(مكة)</span></p>'
   +'<div class="font-label-md text-label-md flex flex-col gap-0.5">'+row('الهاتف',b.phone)+row('السن',b.age)+row('البلد',b.country)+row('المسار',b.program)+row('رقم الحجز',b.id)+'</div>'
   +'<div class="flex flex-wrap gap-2 pt-1">'
   +(b.status==='new'?btn('تأكيد','setBooking('+b.id+',\'confirmed\')','bg-primary text-on-primary'):'')
   +waBtn(b.phone,b.status==='new'||b.status==='confirmed'?confirmMsg:'السلام عليكم '+b.name,'رسالة للطالب')
   +(b.status==='confirmed'?btn('خلصت','setBooking('+b.id+',\'done\')'):'')
   +(b.status!=='cancelled'?btn('إلغاء وفتح الميعاد','if(confirm(\'إلغاء الحجز ده؟\'))setBooking('+b.id+',\'cancelled\')','bg-surface-container text-error'):'')
   +btn('اعمله طالب','studentFromBooking('+b.id+')')
   +'</div></article>';
}
function setBooking(id,st){A.update('bookings','id=eq.'+id,{status:st}).then(function(){toast('اتحدّث');loadBookings()}).catch(fail)}

/* ───── students ───── */
function loadStudents(){
  A.list('students','select=*&order=created_at.desc&limit=500').then(function(rows){
    cache.students={};rows.forEach(function(r){cache.students[r.id]=r});
    $('panel').innerHTML='<button type="button" onclick="openSheet()" class="h-12 rounded-xl bg-secondary text-on-secondary font-title-md text-title-md flex items-center justify-center gap-2"><span class="material-symbols-outlined">person_add</span>طالب جديد</button>'
      +(rows.length?rows.map(studentCard).join(''):empty('مفيش طلاب لسه. ضيف أول طالب أو حوّل حجز لطالب.'));
  }).catch(fail);
}
function studentCard(s){
  var link=location.href.replace(/admin\.html.*$/,'student.html?code='+encodeURIComponent(s.code));
  return '<article class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-2'+(s.active?'':' opacity-60')+'">'
   +'<div class="flex items-center justify-between gap-2"><h3 class="font-title-md text-title-md text-primary">'+esc(s.name)+'</h3><span class="font-label-md text-label-md text-secondary" dir="ltr">'+esc(s.code)+'</span></div>'
   +'<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden"><div class="h-full bg-secondary" style="width:'+(s.progress||0)+'%"></div></div>'
   +'<div class="font-label-md text-label-md flex flex-col gap-0.5">'+row('المسار',s.track)+row('التقدم',(s.progress||0)+'%')+row('الحفظ الجديد',s.new_task)+(s.next_session?row('الحصة الجاية',fmtStamp(s.next_session)):'')+'</div>'
   +'<div class="flex flex-wrap gap-2 pt-1">'+btn('تعديل','openSheet('+s.id+')','bg-primary text-on-primary')
   +(s.phone?waBtn(s.phone,'السلام عليكم '+s.name+'، ده كود متابعتك في مقرأة الإتقان: '+s.code+'\nتقدر تشوف خطتك وتقدمك من هنا: '+link,'ابعت الكود'):'')+'</div></article>';
}
function toLocalInput(s){if(!s)return'';var d=new Date(s),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function openSheet(id,prefill){
  var f=$('studentForm'),s=id?cache.students[id]:(prefill||{});f.reset();
  ['id','booking_id','name','phone','track','progress','sessions_done','new_task','recent_review','far_review','teacher_note'].forEach(function(k){if(f[k])f[k].value=s[k]!=null?s[k]:(k==='progress'||k==='sessions_done'?0:'')});
  f.next_session.value=toLocalInput(s.next_session);f.active.checked=s.active!==false;
  $('sheetTitle').textContent=id?'تعديل الطالب':'طالب جديد';$('sheetCode').textContent=s.code||'';
  $('sheet').classList.remove('hidden');
}
function closeSheet(){$('sheet').classList.add('hidden')}
function studentFromBooking(id){var b=cache.bookings[id];closeSheet();openSheet(null,{name:b.name,phone:b.phone,track:b.program,booking_id:b.id})}
$('studentForm').onsubmit=function(e){
  e.preventDefault();var f=e.target;
  var row={name:f.name.value.trim(),phone:f.phone.value.trim()||null,track:f.track.value.trim()||null,progress:Math.max(0,Math.min(100,parseInt(f.progress.value,10)||0)),sessions_done:Math.max(0,parseInt(f.sessions_done.value,10)||0),
    new_task:f.new_task.value.trim()||null,recent_review:f.recent_review.value.trim()||null,far_review:f.far_review.value.trim()||null,teacher_note:f.teacher_note.value.trim()||null,
    next_session:f.next_session.value?new Date(f.next_session.value).toISOString():null,active:f.active.checked};
  var id=f.id.value,p;
  if(id)p=A.update('students','id=eq.'+id,row);
  else p=A.rpc('new_student_code').then(function(code){row.code=code;if(f.booking_id.value)row.booking_id=parseInt(f.booking_id.value,10);return A.insert('students',row)});
  p.then(function(){closeSheet();toast(id?'اتحفظ':'اتضاف الطالب. ابعتله الكود من زرار "ابعت الكود"');TAB='students';openTab('students')}).catch(fail);
};

/* ───── payments ───── */
function loadPayments(){
  A.list('payments','select=*&order=created_at.desc&limit=300').then(function(rows){
    $('panel').innerHTML=rows.length?rows.map(function(p){
      return '<article class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-2">'
       +'<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2">'+newTag(p)+'<h3 class="font-title-md text-title-md text-primary">'+esc(p.name)+'</h3></div>'+pill(p.status)+'</div>'
       +'<div class="font-label-md text-label-md flex flex-col gap-0.5">'+row('الباقة',p.plan)+row('الوسيلة',p.method)+row('الرقم المحوّل منه',p.phone)+row('وصل',fmtStamp(p.created_at))+row('رقم الطلب',p.id)+'</div>'
       +'<div class="flex flex-wrap gap-2 pt-1">'
       +(p.receipt_path?btn('صورة التحويل','openFile(\''+esc(p.receipt_path)+'\')','bg-primary text-on-primary'):'<span class="font-label-sm text-label-sm text-on-surface-variant self-center">من غير صورة</span>')
       +(p.status==='new'?btn('استلمت الفلوس','setPay('+p.id+',\'verified\')'):'')
       +(p.status==='new'?btn('مرفوض','setPay('+p.id+',\'rejected\')','bg-surface-container text-error'):'')
       +waBtn(p.phone,'السلام عليكم '+p.name+'، '+(p.status==='verified'?'وصلنا اشتراكك في مقرأة الإتقان، جزاك الله خيراً.':'بخصوص التحويل لمقرأة الإتقان:'),'رسالة')
       +'</div></article>';
    }).join(''):empty('مفيش مدفوعات لسه.');
    markSeen('payments');
  }).catch(fail);
}
function setPay(id,st){A.update('payments','id=eq.'+id,{status:st}).then(function(){toast('اتحدّث');loadPayments()}).catch(fail)}
function openFile(path){var w=window.open('','_blank');A.fileUrl(path).then(function(u){if(w)w.location=u;else location.href=u}).catch(function(e){if(w)w.close();fail(e)})}

/* ───── level tests ───── */
function loadTests(){
  A.list('level_tests','select=*&order=created_at.desc&limit=300').then(function(rows){
    $('panel').innerHTML=rows.length?rows.map(function(t){
      return '<article class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-2">'
       +'<div class="flex items-center justify-between gap-2"><div class="flex items-center gap-2">'+newTag(t)+'<h3 class="font-title-md text-title-md text-primary">'+esc(t.name)+'</h3></div><span class="font-label-sm text-label-sm text-on-surface-variant">'+fmtStamp(t.created_at)+'</span></div>'
       +'<div class="font-label-md text-label-md flex flex-col gap-0.5">'+row('الفئة',t.age_group)+row('الحفظ',t.memorized)+row('التجويد',t.tajweed)+row('التوقيت',t.timezone)+row('الفترة',t.period)+row('الهاتف',t.phone)+'</div>'
       +'<div class="flex flex-wrap gap-2 pt-1" id="lt-'+t.id+'">'
       +(t.audio_path?btn('اسمع التلاوة','playRec('+t.id+',\''+esc(t.audio_path)+'\')','bg-primary text-on-primary'):'<span class="font-label-sm text-label-sm text-on-surface-variant self-center">من غير تسجيل</span>')
       +waBtn(t.phone,'السلام عليكم '+t.name+'، وصلنا اختبار المستوى في مقرأة الإتقان. إمتى يناسبك نحدد الحصة المجانية؟','كلّمه')
       +'</div></article>';
    }).join(''):empty('مفيش اختبارات لسه.');
    markSeen('level_tests');
  }).catch(fail);
}
function playRec(id,path){A.fileUrl(path).then(function(u){var a=document.createElement('audio');a.controls=true;a.src=u;a.className='w-full mt-1';var box=$('lt-'+id);box.appendChild(a);a.play().catch(function(){})}).catch(fail)}

/* ───── schedule ───── */
function loadSchedule(){
  Promise.all([A.list('settings','select=*&id=eq.1'),A.list('blocked_slots','select=*&slot_date=gte.'+API.siteNow().date+'&order=slot_date.asc')]).then(function(r){
    var s=r[0][0]||{slot_times:[],days_ahead:14,closed_weekdays:[]},bl=r[1];
    $('panel').innerHTML='<section class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-3"><h3 class="font-title-md text-title-md text-primary">مواعيد الحصص (بتوقيت مكة)</h3>'
      +'<input id="setTimes" class="adm-in" dir="ltr" value="'+esc((s.slot_times||[]).join(', '))+'"><p class="font-label-sm text-label-sm text-on-surface-variant">اكتب الأوقات بنظام 24 ساعة ومفصولة بفاصلة، مثال: 08:00, 09:30, 19:00</p>'
      +'<label class="flex items-center gap-2 font-label-md text-label-md text-primary">الحجز متاح لمدة<input id="setDays" class="adm-in !w-20 text-center" type="number" min="1" max="60" value="'+(s.days_ahead||14)+'">يوم قدام</label>'
      +'<div class="flex flex-col gap-1"><span class="font-label-md text-label-md text-primary">أيام الإجازة الأسبوعية</span><div class="flex flex-wrap gap-2">'
      +DAYS.map(function(d,i){return '<label class="flex items-center gap-1 h-9 px-3 rounded-full bg-surface-container-low font-label-md text-label-md"><input type="checkbox" class="closedDay" value="'+i+'"'+((s.closed_weekdays||[]).indexOf(i)>-1?' checked':'')+'>'+d+'</label>'}).join('')+'</div></div>'
      +'<button type="button" onclick="saveSettings()" class="h-11 rounded-xl bg-secondary text-on-secondary font-title-md text-title-md">حفظ المواعيد</button></section>'
      +'<section class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-3"><h3 class="font-title-md text-title-md text-primary">اقفل يوم معيّن</h3>'
      +'<div class="flex gap-2"><input id="blockDate" class="adm-in flex-1" type="date" min="'+API.siteNow().date+'"><button type="button" onclick="blockDay()" class="h-11 px-4 rounded-xl bg-primary text-on-primary font-label-md text-label-md">اقفل</button></div>'
      +(bl.length?bl.map(function(b){return '<div class="flex items-center justify-between font-label-md text-label-md"><span>'+fmtDay(b.slot_date)+(b.slot_time!=='*'?' · '+fmtTime(b.slot_time):' (اليوم كله)')+'</span>'+btn('افتحه تاني','unblock(\''+b.slot_date+'\',\''+b.slot_time+'\')')+'</div>'}).join(''):'<p class="font-label-sm text-label-sm text-on-surface-variant">مفيش أيام مقفولة.</p>')
      +'</section>';
  }).catch(fail);
}
function saveSettings(){
  var times=$('setTimes').value.split(/[,،\s]+/).map(function(t){var m=t.trim().match(/^(\d{1,2}):(\d{2})$/);return m&&+m[1]<24&&+m[2]<60?String(+m[1]).padStart(2,'0')+':'+m[2]:null});
  if(times.indexOf(null)>-1||!times.length){toast('في وقت مكتوب غلط. اكتبه زي 09:30',true);return}
  times=times.filter(function(t,i){return times.indexOf(t)===i}).sort();
  var closed=[].slice.call(document.querySelectorAll('.closedDay:checked')).map(function(c){return +c.value});
  A.update('settings','id=eq.1',{slot_times:times,days_ahead:Math.max(1,Math.min(60,parseInt($('setDays').value,10)||14)),closed_weekdays:closed,updated_at:new Date().toISOString()}).then(function(){toast('اتحفظت المواعيد');loadSchedule()}).catch(fail);
}
function blockDay(){var d=$('blockDate').value;if(!d){toast('اختار اليوم',true);return}A.insert('blocked_slots',{slot_date:d,slot_time:'*'}).then(function(){toast('اتقفل اليوم');loadSchedule()}).catch(fail)}
function unblock(d,t){A.remove('blocked_slots','slot_date=eq.'+d+'&slot_time=eq.'+encodeURIComponent(t)).then(function(){loadSchedule()}).catch(fail)}

/* ───── new-item alerts ───── */
var NAMES={bookings:'حجز جديد',payments:'تحويل جديد',level_tests:'اختبار مستوى جديد'};
function title(){var n=0;for(var k in seenCounts)n+=seenCounts[k]||0;document.title=(n?'('+n+') ':'')+'لوحة المقرأة'}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function poll(){
  ['bookings','payments','level_tests'].forEach(function(t){
    A.list(t,'select=id&seen=eq.false&limit=99').then(function(rows){
      var n=rows.length,before=seenCounts[t]||0;
      if(!firstPoll&&n>before){beep();if('Notification' in window&&Notification.permission==='granted'){try{new Notification('مقرأة الإتقان',{body:NAMES[t]+' ('+n+')',icon:'assets/img/logo.svg'})}catch(e){}}}
      // Already looking at this list: just refresh it (unless a form is open)
      if(t===TAB&&n&&$('sheet').classList.contains('hidden')){seenCounts[t]=0;openTab(TAB);return}
      seenCounts[t]=n;$('badge-'+t).textContent=n||'';title();
    }).catch(function(e){if(e&&e.code==='SIGNED_OUT')show('login')});
  });
  setTimeout(function(){firstPoll=false},3000);
}
$('notifyBtn').onclick=function(){Notification.requestPermission().then(function(){$('notifyBtn').classList.add('hidden')})};

/* ───── sign in ───── */
$('loginForm').onsubmit=function(e){
  e.preventDefault();$('loginErr').textContent='';
  A.signIn($('loginEmail').value.trim(),$('loginPass').value).then(function(){show('app')}).catch(function(err){
    $('loginErr').textContent=err.code==='NOT_ADMIN'?'فيه حساب مدير تاني متسجل قبل كده. ادخل بيه.':/confirm/i.test(err.message)?'لسه مأكدتش الإيميل. افتح رسالة التأكيد الأول.':'البريد أو كلمة المرور غلط.';
  });
};
$('signupBtn').onclick=function(){
  var em=$('loginEmail').value.trim(),pw=$('loginPass').value;$('loginErr').textContent='';$('loginInfo').textContent='';
  if(!/^\S+@\S+\.\S+$/.test(em)){$('loginErr').textContent='اكتب إيميل صحيح الأول';return}
  if(pw.length<8){$('loginErr').textContent='كلمة السر لازم تكون 8 حروف أو أكتر';return}
  A.signUp(em,pw).then(function(r){
    if(r==='signed_in')show('app');
    else $('loginInfo').textContent='بعتنالك إيميل تأكيد. افتحه ودوس على اللينك، وبعدين ارجع هنا ودوس دخول.';
  }).catch(function(err){
    $('loginErr').textContent=err.code==='NOT_ADMIN'?'فيه حساب مدير متسجل قبل كده. ادخل بيه.':/registered|exists/i.test(err.message)?'الإيميل ده متسجل قبل كده. دوس دخول.':'حصلت مشكلة: '+err.message;
  });
};
$('logoutBtn').onclick=function(){A.signOut();show('login')};
try{TAB=localStorage.getItem('itqan_admin_tab')||'bookings'}catch(e){}
if(!API.online)show('setup');else if(A.session())show('app');else show('login');
</script>
