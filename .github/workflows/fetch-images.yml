# One-time job: copies the Stitch-hosted images into assets/img, then deletes itself.
name: fetch-images
on:
  push:
    branches: [claude/assets-library-cleanup]
    paths: ['.github/workflows/fetch-images.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
