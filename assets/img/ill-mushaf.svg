<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="مصحف مفتوح على حامل">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16285A"/><stop offset="1" stop-color="#0F1B3D"/></linearGradient>
    <pattern id="st" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E2B65C" stroke-opacity=".13" stroke-width="1">
        <rect x="10" y="10" width="20" height="20"/><rect x="10" y="10" width="20" height="20" transform="rotate(45 20 20)"/>
      </g>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#E2B65C" stop-opacity=".35"/><stop offset="1" stop-color="#E2B65C" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <rect width="400" height="220" fill="url(#st)"/>
  <ellipse cx="200" cy="105" rx="150" ry="95" fill="url(#glow)"/>
  <!-- arch -->
  <path d="M120 200V95a80 80 0 0 1 160 0v105" fill="none" stroke="#E2B65C" stroke-opacity=".55" stroke-width="2"/>
  <!-- rehal (book stand) -->
  <path d="M150 196l50-34 50 34" fill="none" stroke="#C8902E" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 162l50 34 50-34" fill="none" stroke="#A8741F" stroke-width="7" stroke-linecap="round"/>
  <!-- open book -->
  <path d="M200 120c-20-12-42-15-62-11v48c20-4 42-1 62 11 20-12 42-15 62-11v-48c-20-4-42-1-62 11z" fill="#FBF3DF"/>
  <path d="M200 120v48" stroke="#C8902E" stroke-width="2"/>
  <g stroke="#C9B48A" stroke-width="2" stroke-linecap="round">
    <path d="M150 120h38M150 130h38M150 140h38M150 150h30"/>
    <path d="M212 120h38M212 130h38M212 140h38M220 150h30"/>
  </g>
  <!-- stars -->
  <g fill="#F6DFA6">
    <circle cx="70" cy="50" r="2"/><circle cx="330" cy="40" r="2.5"/><circle cx="350" cy="110" r="1.6"/><circle cx="48" cy="130" r="1.6"/><circle cx="300" cy="70" r="1.4"/>
  </g>
  <path d="M84 70a16 16 0 1 0 14-26 13 13 0 1 1-14 26z" fill="#E2B65C"/>
</svg>
